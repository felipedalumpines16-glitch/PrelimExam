<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log in page Prelim Exam</title>
	<style>
		:root {
			font-family: "Segoe UI", Arial, sans-serif;
			color: #1f2937;
			background: #eef2ff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: linear-gradient(135deg, #e0e7ff, #f8fafc);
		}

		.login-card {
			width: min(100%, 400px);
			padding: 40px;
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			box-shadow: 0 18px 45px rgba(30, 41, 59, 0.12);
		}

		h1 {
			margin: 0 0 8px;
			font-size: 30px;
			color: #111827;
		}

		.subtitle {
			margin: 0 0 28px;
			color: #64748b;
		}

		.field {
			display: block;
			margin-bottom: 18px;
			font-weight: 600;
			font-size: 14px;
		}

		input[type="email"],
		input[type="password"] {
			width: 100%;
			margin-top: 8px;
			padding: 12px 14px;
			border: 1px solid #cbd5e1;
			border-radius: 7px;
			font: inherit;
		}

		input:focus {
			outline: 3px solid rgba(79, 70, 229, 0.2);
			border-color: #4f46e5;
		}

		.options {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin: 4px 0 24px;
			font-size: 14px;
		}

		.remember {
			display: flex;
			align-items: center;
			gap: 8px;
			color: #475569;
		}

		a {
			color: #4f46e5;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		button {
			width: 100%;
			padding: 13px;
			border: 0;
			border-radius: 7px;
			background: #4f46e5;
			color: #ffffff;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}

		button:hover {
			background: #4338ca;
		}

		.signup {
			margin: 24px 0 0;
			text-align: center;
			color: #64748b;
			font-size: 14px;
		}

		@media (max-width: 480px) {
			.login-card {
				padding: 28px 22px;
			}
		}
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Welcome back</h1>
		<p class="subtitle">Log in to continue to your account.</p>

		<form action="#" method="post">
			<label class="field" for="email">
				Email address
				<input id="email" name="email" type="email" autocomplete="email" required>
			</label>

			<label class="field" for="password">
				Password
				<input id="password" name="password" type="password" autocomplete="current-password" required>
			</label>

			<div class="options">
				<label class="remember">
					<input type="checkbox" name="remember">
					Remember me
				</label>
				<a href="#">Forgot password?</a>
			</div>

			<button type="submit">Log in</button>
		</form>

		<p class="signup">Don't have an account? <a href="#">Sign up</a></p>
	</main>
</body>
</html>
